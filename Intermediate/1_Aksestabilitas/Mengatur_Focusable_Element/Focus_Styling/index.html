        <section>
        <h1>Focus styling</h1>
        <!--
            Focus Styling dengan focus indicator atau focus ring yang berguna menginformasikan user mengenai focus element selama aktif di halaman, tidak untuk tunanetra. 

            Untuk melakukan custom styling pada focus ring, kita perlu memanfaatkan pseudo-class seperti :focus. Contohnya:

            div[tabindex="0"]:focus {
                outline: 4px dashed oranged;
            }

            Pseudo-class :focus-visible relatif lebih direkomendasikan karena penerapannya hanya akan tampak ketika elemen difokuskan melalui non-pointer input seperti keyboard.
        -->
        <a href="#" class="style1">Focus style #1</a>
        <a href="#" class="style2">Focus style #2</a>
        <a href="#" class="style3">Focus style #3</a>
        <a href="#" class="style4">Focus style #4</a>
        <a href="#" class="style5">Focus style #5</a>
    </section>
    </body>
</html>
