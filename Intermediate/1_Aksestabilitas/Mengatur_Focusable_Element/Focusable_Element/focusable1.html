<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Focusable Elements</title>
</head>
<body>
    <!--Focusable Elements adalah facusable bawaan yang berada pada elemen form control, elemen link, elemen button-->
    <!--Elemen lainnya tidaklah besifat focusable sepereti heading, paragraf, div, gambar, dll. Dan elemen  ini disebut dengan inert element. Jika ingin mengubah inert element menjadi focusable element maka kita bisa menggunakan HTML attribute bernama tabindex sehingga membuat inert elements dapat difokuskan melalui tab key dan bahkan sebaliknya-->
    <section>
        <div tabindex="0">Hello World!</div>        <!-- Mengubah Inert Element menjadi Focus Element-->
        <input tabindex="-1" value="Hello World!">  <!-- Mengubah Focus Element manjadi Inert Element-->
    <!--
        Catatan
        Sangat tidak disarankan untuk memberikan nilai tabindex selain 0 dan -1 karena akan merusak urutan fokus elemen. Pikirkan ulang jika Anda hendak melakukannya. Gunakan cara lain seperti mengatur urutan elemen untuk menciptakan urutan fokus secara intuitif.
    -->
    </section>
    <section>
        <h2>Text Input</h2>

        <input id="textinput" type="text" placeholder="Nama Depan">
    </section>

    <section>
        <h2>Checkbox</h2>

        <input id="checkbox" type="checkbox">
        <label for="checkbox">Saya setuju!</label>
    </section>

    <section>
        <h2>Radio Button</h2>

        <input id="radio1" type="radio" name="radio" value="0">
        <label for="radio1">Jeruk</label>
        <input id="radio2" type="radio" name="radio" value="0">
        <label for="radio2">Mangga</label>
        <input id="radio3" type="radio" name="radio" value="0">
        <label for="radio3">Melon</label>
    </section>

    <section>
        <h2>Select Option</h2>

        <select>
        <option>Jeruk</option>
        <option>Mangga</option>
        <option>Apel</option>
        <option>Semangka</option>
        <option>Jambu</option>
        </select>
    </section>

    <section>
        <h2>Text Area</h2>

        <textarea style="min-height: 100px;" placeholder="Alamat"></textarea>
    </section>

    <section>
        <h2>Elemen dengan <code>contenteditable="true"</code></h2>

        <div contenteditable="true" style="border: 1px solid black; width: 150px;">
        Coba edit text ini!
        </div>
    </section>

    <section>
        <h2>Anchor (Navigation)</h2>
        <a href="https://dicoding.com" target="_blank">Menuju dicoding.com</a>
    </section>

    <section>
        <h2>Tombol</h2>
        <button>Coba click saya!</button>
    </section>

    <section>
        <h2>Lainnya</h2>

        <input type="date">
        <br><br>
        <label for="points">Points (between 0 and 10):</label>
        <br>
        <input type="range" id="points" name="points" min="0" max="10">
        <br>
        <input type="color">
    </section>
</body>
</html>
